<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aetheria | 432Hz Harmonic Player</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aetheria" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/images/icon-512x512.png" />
    <link rel="shortcut icon" type="image/png" href="/images/icon-192x192.png" />

    <!-- iOS Icons -->
    <link rel="apple-touch-icon" sizes="192x192" href="/images/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/images/icon-512x512.png" />
    <style>
      /* Custom Scrollbar for Playlist */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #4b5563; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #fbbf24; 
      }
      body {
        background-color: #020617;
        color: #e2e8f0;
      }
    </style>
</head>
  <body>
    <div id="root">
       <div style="height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center; background-color: #000; color: #fbbf24; font-family: sans-serif; flex-direction: column;">
          <svg class="animate-spin" style="width: 40px; height: 40px; margin-bottom: 20px;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <p>Initializing Aetheria...</p>
       </div>
    </div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
